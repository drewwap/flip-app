<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>flip. — one button. gravity's a suggestion.</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #05070d; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  canvas {
    width: min(100vw, calc(100dvh * 9 / 16));
    height: auto;
    display: block;
    border-radius: 4px;
  }
</style>
</head>
<body>
<canvas id="game" width="360" height="640"></canvas>
<script src="core.js"></script>
<script>
"use strict";
/* flip. — renderer + input. The brain lives in core.js; this file just paints. */

(() => {
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  const C = Core;

  // crisp on high-density screens, capped so we don't melt phones
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = C.W * dpr;
  cv.height = C.H * dpr;
  ctx.scale(dpr, dpr);

  // ---- state ----
  let world = C.newWorld();
  let state = "start";        // start | play | dead
  let deathAt = 0;
  let acc = 0;
  const STEP = 1 / 60;

  // no persistent storage in this runtime — best score lives for the session
  let best = 0;

  // ---- juice state ----
  let squash = 0;             // flip squash, decays
  let shake = 0;              // screen shake, decays
  let passFlash = 0;
  const trail = [];
  const particles = [];
  const sparks = [];          // pass sparks at wall gap

  // ---- audio (tiny synth, no files, no network) ----
  let actx = null;
  let muted = false;
  function audio() {
    if (muted) return null;
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
      }
      if (actx.state === "suspended") actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function blip(freqA, freqB, dur, type, vol) {
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freqA, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, freqB), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    flip: () => blip(300, 540, 0.08, "square", 0.05),
    pass: () => blip(880, 1320, 0.07, "sine", 0.06),
    dead: () => blip(220, 55, 0.4, "sawtooth", 0.09),
  };

  // ---- input: the entire screen is the button ----
  function press(now) {
    if (state === "start") {
      startRun(now);
      return;
    }
    if (state === "dead") {
      if (now - deathAt > 0.6) startRun(now);
      return;
    }
    if (C.tryFlip(world, world.t)) {
      squash = 1;
      sfx.flip();
      const px = C.BALL_X;
      const py = world.y;
      for (let k = 0; k < 10; k += 1) {
        particles.push({
          x: px, y: py,
          vx: (Math.random() - 0.5) * 160,
          vy: (Math.random() - 0.5) * 160 - 40,
          life: 0.35 + Math.random() * 0.25,
          max: 0.6,
          c: world.dir > 0 ? "rgba(255,93,143," : "rgba(64,224,255,",
        });
      }
    }
  }

  function startRun(now) {
    world = C.newWorld();
    state = "play";
    acc = 0;
    trail.length = 0;
    particles.length = 0;
    sparks.length = 0;
    squash = 0;
    shake = 0;
    passFlash = 0;
  }

  // ---- events ----
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); press(performance.now() / 1000); });
  cv.addEventListener("touchstart", (e) => { e.preventDefault(); press(performance.now() / 1000); }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") {
      e.preventDefault();
      press(performance.now() / 1000);
    }
    if (e.code === "KeyM") {
      muted = !muted;
    }
  });

  // ---- loop ----
  let last = performance.now();
  function frame(nowMs) {
    const now = nowMs / 1000;
    let dt = (nowMs - last) / 1000;
    last = nowMs;
    if (dt > 0.1) dt = 0.1;

    if (state === "play") {
      acc += dt;
      while (acc >= STEP) {
        acc -= STEP;
        const ev = C.step(world, STEP);
        if (ev === "pass") {
          best = Math.max(best, world.score);
          passFlash = 1;
          sfx.pass();
          const w = world.walls.find((x) => x.passed && x.x > C.BALL_X - 60);
          if (w) {
            for (let k = 0; k < 8; k += 1) {
              sparks.push({ x: w.x, y: w.gapY, vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.5) * 220, life: 0.3, max: 0.3 });
            }
          }
        }
        if (ev === "dead") {
          state = "dead";
          deathAt = now;
          shake = 1;
          sfx.dead();
          break;
        }
      }
    }

    // decay juice
    squash *= Math.pow(0.0001, dt);   // fast decay
    shake *= Math.pow(0.02, dt);
    passFlash *= Math.pow(0.01, dt);
    for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; }
    for (const s of sparks) { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; }
    for (let i = particles.length - 1; i >= 0; i -= 1) if (particles[i].life <= 0) particles.splice(i, 1);
    for (let i = sparks.length - 1; i >= 0; i -= 1) if (sparks[i].life <= 0) sparks.splice(i, 1);

    if (state === "play") {
      trail.push({ x: C.BALL_X, y: world.y, t: now });
      if (trail.length > 14) trail.shift();
    }

    draw(now);
    requestAnimationFrame(frame);
  }

  // ---- drawing ----
  function draw(now) {
    ctx.clearRect(0, 0, C.W, C.H);

    ctx.save();
    if (shake > 0.01) {
      ctx.translate((Math.random() - 0.5) * 14 * shake, (Math.random() - 0.5) * 14 * shake);
    }

    // background
    const g = ctx.createLinearGradient(0, 0, 0, C.H);
    g.addColorStop(0, "#0b1020");
    g.addColorStop(1, "#070a14");
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, C.W + 40, C.H + 40);

    // speed grid — dots that rush past faster as you score
    const sp = state === "play" ? world.speed : C.START_SPEED;
    ctx.fillStyle = "rgba(120,140,200,0.14)";
    const off = (now * sp * 0.6) % 60;
    for (let y = -60 + off; y < C.H + 60; y += 60) {
      for (let x = 20; x < C.W; x += 60) {
        ctx.beginPath();
        ctx.arc(x, y, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // walls
    for (const w of world.walls) {
      const cx = w.x;
      const halfGap = C.GAP_H / 2;
      ctx.fillStyle = "#ff5d8f";
      ctx.fillRect(cx - C.WALL_W / 2, -20, C.WALL_W, w.gapY - halfGap + 20);
      ctx.fillRect(cx - C.WALL_W / 2, w.gapY + halfGap, C.WALL_W, C.H - w.gapY - halfGap + 20);
      // gap glow
      const glow = ctx.createLinearGradient(cx - 26, 0, cx + 26, 0);
      glow.addColorStop(0, "rgba(64,224,255,0)");
      glow.addColorStop(0.5, "rgba(64,224,255," + (0.25 + 0.2 * passFlash) + ")");
      glow.addColorStop(1, "rgba(64,224,255,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(cx - 26, w.gapY - halfGap - 3, 52, 6);
    }

    // sparks
    for (const s of sparks) {
      ctx.fillStyle = "rgba(64,224,255," + Math.max(0, s.life / s.max) + ")";
      ctx.beginPath();
      ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // trail
    for (let i = 0; i < trail.length; i += 1) {
      const t = trail[i];
      const a = (i / trail.length) * 0.22;
      ctx.fillStyle = "rgba(255,255,255," + a + ")";
      ctx.beginPath();
      ctx.arc(t.x, t.y, C.BALL_R * (0.4 + 0.6 * (i / trail.length)), 0, Math.PI * 2);
      ctx.fill();
    }

    // ball
    if (state === "play" || state === "dead") {
      const sq = 1 + squash * 0.35;
      ctx.save();
      ctx.translate(C.BALL_X, world.y);
      ctx.scale(sq, 1 / sq);
      ctx.fillStyle = "#f4f7ff";
      ctx.beginPath();
      ctx.arc(0, 0, C.BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = world.dir > 0 ? "#ff5d8f" : "#40e0ff";
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    }

    // flip particles
    for (const p of particles) {
      ctx.fillStyle = p.c + Math.max(0, p.life / p.max) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // HUD
    if (state === "play" || state === "dead") {
      ctx.fillStyle = "rgba(244,247,255,0.95)";
      ctx.font = "700 44px ui-monospace, Menlo, monospace";
      ctx.textAlign = "center";
      ctx.fillText(String(world.score), C.W / 2, 66);
      ctx.font = "11px ui-monospace, Menlo, monospace";
      ctx.fillStyle = "rgba(244,247,255,0.4)";
      ctx.fillText("WALLS", C.W / 2, 84);
      ctx.textAlign = "right";
      ctx.font = "12px ui-monospace, Menlo, monospace";
      ctx.fillStyle = "rgba(244,247,255,0.5)";
      ctx.fillText("BEST " + Math.max(best, world.score), C.W - 14, 30);
    }

    // mute badge
    ctx.textAlign = "left";
    ctx.font = "12px ui-monospace, Menlo, monospace";
    ctx.fillStyle = "rgba(244,247,255,0.35)";
    ctx.fillText(muted ? "MUTED" : "M: SOUND", 14, 30);

    ctx.restore();

    // ---- overlays ----
    if (state === "start") {
      ctx.fillStyle = "rgba(5,7,13,0.72)";
      ctx.fillRect(0, 0, C.W, C.H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#f4f7ff";
      ctx.font = "700 72px ui-monospace, Menlo, monospace";
      ctx.fillText("flip.", C.W / 2, 240);
      ctx.font = "16px ui-monospace, Menlo, monospace";
      ctx.fillStyle = "rgba(244,247,255,0.85)";
      ctx.fillText("one button. one rule.", C.W / 2, 288);
      ctx.fillStyle = "#40e0ff";
      ctx.fillText("tap to flip gravity", C.W / 2, 330);
      ctx.fillStyle = "rgba(244,247,255,0.4)";
      ctx.font = "12px ui-monospace, Menlo, monospace";
      ctx.fillText("the gaps follow one sine wave. no luck, only timing.", C.W / 2, 372);
      if (best > 0) {
        ctx.fillStyle = "rgba(255,93,143,0.9)";
        ctx.font = "14px ui-monospace, Menlo, monospace";
        ctx.fillText("best: " + best + " walls", C.W / 2, 410);
      }
      ctx.fillStyle = "rgba(244,247,255,0.3)";
      ctx.font = "11px ui-monospace, Menlo, monospace";
      ctx.fillText("M = mute", C.W / 2, 600);
    }

    if (state === "dead") {
      ctx.fillStyle = "rgba(5,7,13,0.72)";
      ctx.fillRect(0, 0, C.W, C.H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ff5d8f";
      ctx.font = "700 64px ui-monospace, Menlo, monospace";
      ctx.fillText(String(world.score), C.W / 2, 250);
      ctx.font = "14px ui-monospace, Menlo, monospace";
      ctx.fillStyle = "rgba(244,247,255,0.6)";
      ctx.fillText("WALLS", C.W / 2, 278);
      ctx.fillStyle = "rgba(244,247,255,0.85)";
      ctx.font = "16px ui-monospace, Menlo, monospace";
      if (world.score >= best && world.score > 0) {
        ctx.fillText("new best", C.W / 2, 330);
      } else {
        ctx.fillText("best: " + best, C.W / 2, 330);
      }
      ctx.fillStyle = "#40e0ff";
      ctx.font = "16px ui-monospace, Menlo, monospace";
      ctx.fillText("tap to flip again", C.W / 2, 400);
    }
  }

  requestAnimationFrame(frame);
})();
